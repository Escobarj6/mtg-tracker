[project]
name = "mtg-api"
version = "0.1.0"
description = "backend API for MTG Tracker: collection and Commander deck management."
readme = "README.md"
authors = [
    { name = "escobarj", email = "157618076+Escobarj6@users.noreply.github.com" }
]
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.1",
    "fastapi[standard-no-fastapi-cloud-cli]>=0.161.1",
    "pydantic-settings>=2.16.1",
    "pyodbc>=5.3.0",
    "sqlalchemy>=2.1.6",
    "sqlmodel>=0.0.48",
]

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.2",
]

[tool.ruff]
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
