[project]
name = "mtg-api"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "escobarj", email = "escobarj6@southernct.edu" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard-no-fastapi-cloud-cli]>=0.161.1",
    "pydantic-settings>=2.16.1",
    "pyodbc>=5.3.0",
    "sqlalchemy>=2.1.6",
]

[project.scripts]
mtg-api = "mtg_api:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.2",
]
